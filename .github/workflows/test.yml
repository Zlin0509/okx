name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m research.synthetic_guard pytest -q tests --ignore-glob='*test_research*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check okx_workbench/static/app.js
  research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv pip install --python .venv/bin/python --require-hashes -r research/statistics/requirements.lock
      - name: Run offline research tests
        run: |
          research_tests=()
          for test_file in tests/test_research*.py; do
            if [[ "$test_file" != tests/test_research_r2.py ]]; then
              research_tests+=("$test_file")
            fi
          done
          uv run --no-sync python -m research.synthetic_guard pytest -q "${research_tests[@]}"
      - run: uv run --no-sync python -m research.m3 verify
      - run: uv run --no-sync python -m research.statistics verify
      - run: uv run --no-sync python -m research.experiments synthetic --output research/runtime/ci-wiring
      - run: uv run --no-sync python -m research.experiments acceptance-synthetic --output research/runtime/ci-acceptance
      - name: Confirm real input is refused
        run: |
          code=0
          uv run --no-sync python -m research.experiments real || code=$?
          test "$code" -eq 2
